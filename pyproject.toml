[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hytopomem"
version = "0.1.0"
description = "HyTopoMem: hierarchical topological memory with hyperbolic path retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "rank-bm25>=0.2.2",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
torch = [
    "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
