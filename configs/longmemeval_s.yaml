dataset:
  name: longmemeval_s
  official_eval: true

data:
  raw_path: data/longmemeval/raw/longmemeval_s_cleaned.json
  processed_path: data/longmemeval/processed/longmemeval_s_mvp.json

graph:
  nodes_path: outputs/longmemeval_s/nodes.json
  graph_path: outputs/longmemeval_s/graph_v3_9.json

retrieval:
  # Stage 1: fused candidates produced by the retrieval routes.
  candidate_topn: 150
  # Stage 2: frozen pool exposed to reconstruction and temporal grounding.
  retrieval_pool_topk: 50
  # Stage 3: maximum whole evidence/path units passed to reconstruction/QA.
  final_topk: 50
  restrict_conversation: true

selector:
  mode: apply_only
  pretrained_model: outputs/models/v3_9_locomo_lgbm.pkl
  feature_names: outputs/models/v3_9_feature_names.json

qa_eval:
  dataset: longmemeval
  # Matches the frozen Top-50 reconstruction protocol. Retrieval is also
  # evaluated at K=20, but that reporting cutoff does not truncate QA context.
  k: 50
  max_context_chars: 80000
  context_mode: raw_or_hybrid
  output: outputs/longmemeval_s/qa_predictions.json
  official_jsonl: outputs/longmemeval_s/hypotheses.jsonl
